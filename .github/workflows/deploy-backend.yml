name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check backend

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          mkdir -p .deploy
          cp -r backend/* .deploy/
          cp backend/Dockerfile.hf .deploy/Dockerfile
          python - << 'EOF'
import os
from huggingface_hub import HfApi

token = os.environ.get("HF_TOKEN")
api = HfApi()
api.upload_folder(
    folder_path=".deploy",
    repo_id="Nihronick/blackrose-backend",
    repo_type="space",
    token=token,
)
print("Successfully uploaded backend to Hugging Face Space!")
EOF

      - name: Clean up Credentials & Deployment Folder
        if: always()
        run: |
          rm -f ~/.git-credentials
          rm -rf .deploy
