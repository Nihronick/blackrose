name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Срабатывает при каждом пуше в ветку main
  workflow_dispatch:      # Позволяет запускать вручную из вкладки Actions

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build 🔧
        run: |
          cd frontend
          npm install
          npm run build
        env:
          # Подставляем адрес бэкенда из секретов GitHub (рекомендуется)
          # Или напишите сюда адрес напрямую, если не боитесь спама
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://your-back4app-url.b4a.run' }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages # Код сайта будет лежать в этой ветке

      - name: Delete Old Workflow Runs 🧹
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
