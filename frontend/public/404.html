<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>BlackRose — Slayer Legend Guides</title>
  <script>
    // GitHub Pages SPA fallback
    // When a user visits a deep link (e.g. /guide/my-guide), GitHub Pages
    // returns a 404. This script preserves the path and redirects to index.html
    // using a session redirect strategy that BrowserRouter can pick up.
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
