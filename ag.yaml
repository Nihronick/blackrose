# ============================================================
# 🔄 Workflows (цепочки отработки задач)
# ============================================================

workflows:
  # Полный цикл: новая фича
  fullstack-feature:
    description: Разработка фичи «под ключ» — от архитектуры до деплоя
    steps:
      - agent: architect
        task: Спроектировать архитектуру и API для фичи
        output: task_plan.md, архитектурное описание в findings.md
      - agent: developer
        task: Реализовать бэкенд по архитектуре
        depends_on: architect
        output: код, миграции, документация API
      - agent: frontend
        task: Реализовать фронтенд-компоненты под API
        depends_on: architect
        output: компоненты, стили
      - agent: auditor
        task: Провести аудит безопасности всего написанного кода
        depends_on: [developer, frontend]
        on_failure: return_to_previous
      - agent: tester
        task: Написать и запустить тесты, проверить интеграцию
        depends_on: auditor
        on_failure: return_to_previous
      - agent: tester
        task: Quality Gate — финальная валидация перед деплоем
        depends_on: tester
        gate: true
    max_iterations: 3

  # Быстрый багфикс
  bugfix:
    description: Исправление бага с проверкой безопасности
    steps:
      - agent: developer
        task: Найти причину и исправить баг
        output: исправленный код
      - agent: auditor
        task: Проверить фикс на безопасность
        depends_on: developer
      - agent: tester
        task: Написать тест на баг и прогнать существующие тесты
        depends_on: auditor
        gate: true
    max_iterations: 2

  # Рефакторинг
  refactor:
    description: Безопасный рефакторинг с полным аудитом
    steps:
      - agent: auditor
        task: Провести аудит кода, найти проблемные места
        output: список проблем в findings.md
      - agent: developer
        task: Выполнить рефакторинг согласно аудиту
        depends_on: auditor
      - agent: tester
        task: Проверить, что тесты проходят
        depends_on: developer
        gate: true
    max_iterations: 2

  # Аудит безопасности
  security-audit:
    description: Полный аудит безопасности существующего кода
    steps:
      - agent: auditor
        task: Провести полный аудит безопасности (OWASP Top 10, секреты, SQLi, XSS)
        output: отчёт в findings.md с пометкой [SECURITY]
      - agent: developer
        task: Исправить все найденные уязвимости
        depends_on: auditor
        optional: true
      - agent: auditor
        task: Повторный аудит после исправлений
        depends_on: developer
        gate: true
    max_iterations: 2

# ============================================================
# 🛡️ Quality Gate (единые правила для всех workflow)
# ============================================================

quality_gate:
  required_checks:
    - name: Аудит безопасности
      agent: auditor
      rule: Пройти проверку по OWASP Top 10, утечкам секретов, SQLi, XSS
      skill: security-auditor
    - name: Тесты проходят
      agent: tester
      rule: Все существующие и новые тесты должны проходить (pytest, npm run build)
      skill: tdd-workflow
    - name: Manus Protocol обновлён
      agent: tester
      rule: task_plan.md, findings.md, progress.md должны быть актуальны
    - name: Нет антипаттернов
      agent: auditor
      rule: Сверить с разделом «Антипаттерны» в CLAUDE.md
      skill: vibe-code-auditor

# ============================================================
# 📬 Mailbox System (настройки)
# ============================================================

mailbox:
  base_path: docs/swarm/mailboxes
  roles:
    - architect
    - developer
    - auditor
    - frontend
    - tester
  message_schema:
    fields:
      - sender: string
      - receiver: string
      - timestamp: ISO8601
      - type: task | question | review | block | approve
      - body: string
      - attachments: array of file paths

# ============================================================
# ⚙️ Глобальные ограничения
# ============================================================

global:
  max_iterations_total: 5
  timeout_per_agent_minutes: 30
  cache_skills: true
  auto_load_catalog: docs/skills_catalog.md
  mandatory_skills_before_task:
    - skills/sentinel/SKILL.md

