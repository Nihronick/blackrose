version: '3.8'

services:
  backend:
    build: .
    user: developer
    command: sleep infinity
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # AIO Sandbox — All-in-One Agent Sandbox Environment
  # Browser (VNC), Shell, File, VSCode Server, Jupyter, MCP — в одном контейнере
  # Docs: https://sandbox.agent-infra.com/
  sandbox:
    image: ghcr.io/agent-infra/sandbox:1.11.0
    security_opt:
      - seccomp:unconfined
    environment:
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:-blackrose-dev-key}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blackrose
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d blackrose"]
      interval: 5s
      timeout: 5s
      retries: 5
