[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── FastAPI API ────────────────────────────────────────────────
[program:api]
command=sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT:-7860} --workers 1 --log-level ${LOG_LEVEL:-info}"
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0


