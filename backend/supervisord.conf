[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── FastAPI API ────────────────────────────────────────────────
[program:api]
command=sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT:-7860} --workers 1 --log-level ${LOG_LEVEL:-info}"
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ── ARQ Worker (только если REDIS_URL задан) ───────────────────
[program:worker]
command=sh -c 'if [ -n "$REDIS_URL" ]; then arq workers.notify.WorkerSettings; else echo "No REDIS_URL, worker skipped" && sleep infinity; fi'
directory=/app
autostart=true
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
[program:gc_worker]
command=python workers/gc_storage.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
startsecs=10
